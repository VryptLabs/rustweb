name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tag matches workspace version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VER=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          test "$TAG" = "$VER" || { echo "tag v$TAG != workspace version $VER"; exit 1; }
      - run: cargo test --workspace --all-targets --release

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -e
          for crate in core macro dom router ssr testing cli; do
            name=$(grep '^name' "crates/$crate/Cargo.toml" | head -1 | sed 's/.*"\(.*\)"/\1/')
            echo "Publishing $name…"
            cargo publish -p "$name" --no-verify
            sleep 30
          done

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            See MIGRATION.md for breaking changes and upgrade steps.
