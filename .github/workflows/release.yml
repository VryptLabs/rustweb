name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tag matches workspace version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VER=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          test "$TAG" = "$VER" || { echo "tag v$TAG != workspace version $VER"; exit 1; }
      - run: cargo test --workspace --all-targets --release

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check registry token
        id: token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish crates in dependency order
        if: steps.token.outputs.present == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -e
          for crate in core macro dom router ssr testing cli ui; do
            name=$(grep '^name' "crates/$crate/Cargo.toml" | head -1 | sed 's/.*"\(.*\)"/\1/')
            echo "Publishing $name"
            cargo publish -p "$name" --no-verify
            sleep 30
          done
      - name: Skip publish (no CARGO_REGISTRY_TOKEN configured)
        if: steps.token.outputs.present != 'true'
        run: echo "Skipping crates.io publish; set CARGO_REGISTRY_TOKEN to enable."

  github-release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body_path: CHANGELOG.md
          append_body: true
