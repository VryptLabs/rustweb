[package]
name = "rustweb-macro"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Proc-macro crate: html! with ARIA, events, conditional rendering, typed props"

[lib]
proc-macro = true

[dependencies]
syn = { version = "3", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
