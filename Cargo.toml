[workspace]
members = [
  "crates/core",
  "crates/macro",
  "crates/dom",
  "crates/router",
  "crates/ssr",
  "crates/testing",
  "crates/cli",
  "tests",
  "examples/todo-app",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/VryptLabs/rustweb"
rust-version = "1.75"

[workspace.dependencies]
rustweb-core = { path = "crates/core" }
rustweb-macro = { path = "crates/macro" }
rustweb-dom = { path = "crates/dom" }
rustweb-router = { path = "crates/router" }
rustweb-ssr = { path = "crates/ssr" }
rustweb-testing = { path = "crates/testing" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
